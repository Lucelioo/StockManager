server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: stockmanager-backend

  datasource:
    url: jdbc:mysql://localhost:3306/stockmanager?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:stockmanager-secret-key-for-jwt-2023-very-long-secret}
  access-expiration: 900000  # 15 minutos
  refresh-expiration: 604800000  # 7 dias

logging:
  level:
    com.stockmanager: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}